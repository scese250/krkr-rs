name: Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: '27.2.12479018'
  PLATFORM_VERSION: 'android-37.2'
  BUILD_TOOLS_VERSION: '37.0.0'
  AGP_PLATFORM_VERSION: 'android-37.0'
  AGP_BUILD_TOOLS_VERSION: '36.0.0'
  GRADLE_VERSION: '9.7.1'
  ZIG_VERSION: '0.17.0'

jobs:
  apk:
    name: Debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get -o Dpkg::Use-Pty=0 update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get -o Dpkg::Use-Pty=0 install -y --no-install-recommends bison

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve Android SDK root
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Cache Android NDK and SDK packages
        id: cache-android-sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/platforms/${{ env.PLATFORM_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/platforms/${{ env.AGP_PLATFORM_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/${{ env.BUILD_TOOLS_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/${{ env.AGP_BUILD_TOOLS_VERSION }}
          key: android-sdk-${{ env.NDK_VERSION }}-${{ env.PLATFORM_VERSION }}-${{ env.BUILD_TOOLS_VERSION }}-${{ env.AGP_PLATFORM_VERSION }}-${{ env.AGP_BUILD_TOOLS_VERSION }}

      - name: Install the NDK, platform and build-tools
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER="$(command -v sdkmanager || ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install \
            "ndk;$NDK_VERSION" "platforms;$PLATFORM_VERSION" "build-tools;$BUILD_TOOLS_VERSION" \
            "platforms;$AGP_PLATFORM_VERSION" "build-tools;$AGP_BUILD_TOOLS_VERSION"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Zig and C++ dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/zig
            ~/.cache/zig
          key: zig-android-${{ env.ZIG_VERSION }}-${{ hashFiles('deps/build.zig.zon') }}
          restore-keys: |
            zig-android-${{ env.ZIG_VERSION }}-

      - name: Install Zig
        run: |
          ZIG_DIR="$RUNNER_TEMP/zig"
          if [ ! -x "$ZIG_DIR/zig" ]; then
            mkdir -p "$ZIG_DIR"
            curl -sSL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" \
              | tar -xJ --strip-components=1 -C "$ZIG_DIR"
          fi
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          "$ZIG_DIR/zig" version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Build the engine for arm64-v8a (debug)
        run: bash ./crates/android/build-android.sh --ndk "$ANDROID_NDK_HOME" --debug

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Assemble the debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify the packaged native libraries
        run: |
          bash ./crates/android/check-jni-libs.sh --self-test
          bash ./crates/android/check-jni-libs.sh \
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify the APK surface
        run: bash ./scripts/apk_surface_check.sh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: krkr-rs-debug-arm64-v8a
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
