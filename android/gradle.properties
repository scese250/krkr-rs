# Gradle / Android settings for the experimental krkr-rs Android frontend.
# See docs/code/android/build.md: §5 the Gradle project, §6 the shrinker and
# the package's size.

# R8 runs in this daemon, so the heap below is the shrinker's heap.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
